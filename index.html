<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片列表</title>
    <link rel="stylesheet" href="style.css?v=20260709-1905"> <!-- 保持不变 -->
    <link rel="stylesheet" href="download.css?v=20260709-1905"> <!-- 保持不变 -->
    <link rel="stylesheet" href="animation.css?v=20260709-1905"> <!-- 保持不变 -->
</head>

<body>

    <div class="popup-overlay" id="popupOverlay">
        <div class="card3" id="card3">
            <button class="close-btn" id="closeBtn">&times;</button>
            <h3 class="popup-title" id="popupTitle"></h3>
            <p class="popup-desc" id="popupDesc"></p>

            <!-- 新增下载区域 -->
            <div class="download-area" id="downloadArea">
                <!-- 下载项会通过JS动态生成 -->
            </div>

            <!-- ================================================================
                 扩展包推广区
                 内容由 cards.js 按当前卡片动态生成（文案跟随浏览器语言）。
                 只有该卡片 links 里写了 bili / kofi 时才显示，否则整块隐藏。
                 ================================================================ -->
            <div class="extpack" id="extpack" style="display:none;">
                <div class="extpack-head">
                    <span class="extpack-title" id="extpackTitle"></span>
                    <span class="extpack-tag" id="extpackTag"></span>
                </div>
                <p class="extpack-desc" id="extpackDesc1"></p>
                <p class="extpack-desc" id="extpackDesc2"></p>
                <div class="extpack-btns" id="extpackBtns"></div>
            </div>
        </div>
    </div>
    <div class="popup-overlay hidden-overlay" id="hiddenOverlay">
        <div class="card3 hidden-card-panel">
            <button class="close-btn" id="hiddenCloseBtn">&times;</button>
            <h3 class="popup-title" id="hiddenPopupTitle">隐藏卡片</h3>
            <p class="popup-desc" id="hiddenStatus">正在读取隐藏内容...</p>
            <div class="hidden-card-grid" id="hiddenCardGrid"></div>
        </div>
    </div>
    <div class="main-container">

        <div class="card1">
            <img class="sidebar-left-img" src="./恋恋探头.gif">
            <!-- 卡片1内部容器：垂直居中排列 -->
           
            
            <div class="card1-content"> 
                
                <!--启用投票-->
                <!--
                <a href="https://www.bilibili.com/opus/1135360233742270468?spm_id_from=333.1365.0.0" class="card1-xuanchuan">
                    光标投票<br>
                    <p style="font-size: 14px">(点击跳转)</p>
                </a>-->

                
                <div class="card1-img-container">
                    <img src="xk.jpg" alt="卡片1主图" class="card1-img">

                </div>
                
            <!-- 文字介绍 -->

            <p class="card1-desc">普通的线框</p>

            <!-- 五个跳转按钮组 -->
            <div class="card1-buttons">
                <!-- 哔哩哔哩按钮：引入本地图标 -->
                <a href="https://space.bilibili.com/400839602" class="card1-btn">
                    <img style="height: 1em;" src="./biliblil.png"></img>
                    <span style="font-size: 14px">哔哩哔哩</span>
                </a>

                <!-- Ko-fi 按钮：引入本地图标 -->
                <a href="https://ko-fi.com/xkxiankuang" class="card1-btn">
                    <img style="height: 1em;" src="./ko-fi.png"></img>
                    <span style="font-size: 14px">ko-fi</span>
                </a>

                <!-- 爱发电按钮：引入本地图标 -->
                <a href="https://afdian.com/a/xiankuangxk" class="card1-btn">
                    <img style="height: 1em;" src="./爱发电.png"></img>
                    <span style="font-size: 14px">爱发电</span>
                </a>

                <!-- X（推特）：图标本身就是 X，不再加文字，免得显示成「X X」 -->
                <a href="https://x.com/xiankuangxk" class="card1-btn" target="_blank" rel="noopener noreferrer" title="X" aria-label="X">
                    <svg viewBox="0 0 24 24" style="height: 1em; width: 1em; flex-shrink: 0;" fill="currentColor" aria-hidden="true">
                        <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
                    </svg>
                </a>

                <!-- YouTube：红色是它的品牌色，便于一眼认出 -->
                <a href="https://www.youtube.com/@xiankuangxk/videos" class="card1-btn" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" style="height: 1em; width: 1em; flex-shrink: 0;" fill="#FF0000" aria-hidden="true">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <span style="font-size: 14px">YouTube</span>
                </a>
            </div>

        </div>
    </div>
    <div class="card2-grid"></div>
    </div>

    <!-- 只引入合并后的文件 -->
    <script src="cards.js?v=20261004-1709"></script>
</body>

</html>
